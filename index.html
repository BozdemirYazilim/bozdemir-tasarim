<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Bozdemir Tasarım — Mimari tasarım, iç mekân, dış mekân ve mimari görselleştirme projeleri." />
  <meta name="theme-color" content="#0a0a0a" />
  <meta property="og:title" content="Bozdemir Tasarım | Mimari Vizyon &amp; Tasarım" />
  <meta property="og:description" content="Mimari tasarım ve görselleştirme portfolyosu." />
  <meta property="og:type" content="website" />
  <title>Bozdemir Tasarım | Mimari Vizyon &amp; Tasarım</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/vendor/glightbox.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ÖZEL CURSOR -->
  <div class="cursor-ring" id="cursorRing"></div>
  <div class="cursor-dot"  id="cursorDot"></div>

  <!-- NAVİGASYON -->
  <header class="site-nav" id="siteNav">
    <div class="nav-inner">
      <a href="#hero" class="nav-logo">
        <span class="logo-line1">Bozdemir</span>
        <span class="logo-line2">Tasarım</span>
      </a>
      <nav class="nav-links" aria-label="Site navigasyonu">
        <a href="#projeler" class="nav-link">Projeler</a>
        <a href="#iletisim" class="nav-link">İletişim</a>
      </nav>
      <button class="nav-hamburger" id="navHamburger" aria-label="Menüyü aç/kapat" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
    <div class="nav-drawer" id="navDrawer" aria-hidden="true">
      <a href="#projeler" class="drawer-link">Projeler</a>
      <a href="#iletisim" class="drawer-link">İletişim</a>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero" id="hero">
    <div class="hero-noise" aria-hidden="true"></div>
    <div class="hero-grid" aria-hidden="true"></div>
    <div class="hero-content">
      <p class="hero-eyebrow" id="heroEyebrow">— Mimari Görselleştirme &amp; Tasarım</p>
      <h1 class="hero-title" id="heroTitle">
        <span class="hero-word">Mimari</span>
        <span class="hero-word">Vizyon</span>
        <span class="hero-word accent-word">&amp;</span>
        <span class="hero-word">Tasarım</span>
      </h1>
      <p class="hero-brand" id="heroBrand">Bozdemir Tasarım</p>
      <a href="#projeler" class="hero-cta" id="heroCta">
        Projeleri Keşfet
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </a>
    </div>
    <div class="scroll-hint" id="scrollHint" aria-hidden="true">
      <div class="scroll-line"></div>
      <span>Kaydır</span>
    </div>
  </section>

  <!-- PROJELER -->
  <section class="projects-section" id="projeler">
    <div class="container">
      <div class="section-header">
        <p class="section-eyebrow">Portfolyo</p>
        <h2 class="section-title">Projeler</h2>
        <div class="section-rule" aria-hidden="true"></div>
      </div>

      <div class="filter-bar" id="filterBar" role="group" aria-label="Proje filtresi">
        <button class="filter-btn active" data-filter="all">Tümü</button>
        <button class="filter-btn" data-filter="dis-mekan">Dış Mekan</button>
        <button class="filter-btn" data-filter="ic-mekan">İç Mekan</button>
        <button class="filter-btn" data-filter="konsept">Konsept</button>
      </div>

      <!-- Projeler data/projects.json'dan JS tarafından dinamik olarak yüklenir -->
      <div class="projects-grid" id="projectsGrid"></div>
    </div>
  </section>

  <!-- İLETİŞİM -->
  <section class="contact-section" id="iletisim">
    <div class="container">
      <div class="section-header">
        <p class="section-eyebrow">Bize Ulaşın</p>
        <h2 class="section-title">İletişim</h2>
        <div class="section-rule" aria-hidden="true"></div>
      </div>

      <div class="contact-grid">
        <div class="contact-info">
          <div class="contact-item">
            <span class="contact-label">E-posta</span>
            <a id="contactEmail" href="#" class="contact-value"></a>
          </div>
          <div class="contact-item">
            <span class="contact-label">Telefon</span>
            <a id="contactPhone" href="#" class="contact-value"></a>
          </div>
          <div class="contact-item">
            <span class="contact-label">Konum</span>
            <span id="contactLocation" class="contact-value"></span>
          </div>

          <div class="social-links">
            <a id="contactInstagram" href="#" class="social-link" aria-label="Instagram">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
                <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
              </svg>
            </a>
            <a id="contactLinkedin" href="#" class="social-link" aria-label="LinkedIn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/>
                <rect x="2" y="9" width="4" height="12"/>
                <circle cx="4" cy="4" r="2"/>
              </svg>
            </a>
            <a id="contactBehance" href="#" class="social-link" aria-label="Behance">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M22 7h-7V5h7v2zM9.5 11.5c.83 0 1.5-.67 1.5-1.5S10.33 8.5 9.5 8.5H5v3h4.5zm.25 3.75c0-.97-.78-1.75-1.75-1.75H5v3.5h3c.97 0 1.75-.78 1.75-1.75zM3 6h7.5C12.43 6 14 7.57 14 9.5c0 1.3-.72 2.43-1.78 3.02C13.72 13.1 14.5 14.2 14.5 15.5c0 1.93-1.57 3.5-3.5 3.5H3V6zm11.5 7c0-1.93 1.57-3.5 3.5-3.5s3.5 1.57 3.5 3.5c0 .17-.01.33-.04.5H16c.17.8.9 1.5 2 1.5.7 0 1.28-.3 1.65-.75l1.5.87C20.53 15.88 19.35 16.5 18 16.5c-1.93 0-3.5-1.57-3.5-3.5zm2.1-.75h2.8c-.18-.77-.87-1.25-1.4-1.25-.66 0-1.22.48-1.4 1.25z"/>
              </svg>
            </a>
          </div>
        </div>

        <div class="contact-decoration" aria-hidden="true">
          <div class="deco-line"></div>
          <div class="deco-square"></div>
          <div class="deco-circle"></div>
          <div class="deco-cross">
            <span></span><span></span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <p>&copy; <span id="footerYear"></span> Bozdemir Tasarım. Tüm hakları saklıdır.</p>
  </footer>

  <script defer src="js/vendor/gsap.min.js"></script>
  <script defer src="js/vendor/ScrollTrigger.min.js"></script>
  <script defer src="js/vendor/glightbox.min.js"></script>
  <script defer src="js/main.js?v=3"></script>

</body>
</html>
